
{{define "create_personal_page"}}
{{template "header" .}}






<h2>Регистрация</h2>
       <form action="/create_personal_page" method="post" enctype="multipart/form-data">
           <div class="form-group">
               <label for="name">Имя:</label>
               <input type="text" id="name" name="name" required>
           </div>
           <div class="form-group">
               <label for="surname">Фамилия:</label>
               <input type="text" id="surname" name="surname" required>
           </div>
           <div class="form-group">
               <label for="nickname">Ник:</label>
               <input type="text" id="nickname" name="nickname">
           </div>
           <div class="form-group">
               <label for="email">Почта:</label>
               <input type="email" id="email" name="email" required>
           </div>
           <div class="form-group">
               <label for="password">Пароль:</label>
               <input type="password" id="password" name="password" required>
           </div>
           <div class="form-group">
               <label for="icon1">Изображение (jpg, png):</label>
               <input type="file" id="icon" name="icon1" accept=".jpg, .png">
               <span class="file-upload-label">Выберите изображение</span>
           </div>
           <div class="form-group">
               <label for="backgroud_video">Видео файл:</label>
               <input type="file" id="background_video" name="background_video" accept="video/*">
               <span class="file-upload-label">Выберите видео файл</span>
           </div>
           <div class="form-group">
               <input type="submit" value="Зарегистрироваться">
           </div>
       </form>


{{template "footer"}}
{{end}}
