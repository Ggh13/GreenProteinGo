
{{define "create_train"}}
    {{template "header" .}}



        <h1 class="cover-heading">Тренировка</h1>
        <form action="/create_train" method="post">

            <label for="dropdown">Выберите упражнение:</label>


                <select id="dropdown" name="option_of_train" >
                  {{ range $key, $value := .Unique_types_of_exercises }}
                      {{if eq $key "Last_ex_768" }}
                          <option value="{{$value}}" selected>{{index $.Unique_types_of_exercises $value}}</option>
                      {{else}}
                        <option value="{{$key}}">{{$value}}</option>
                      {{ end }}
                  {{ end }}
                </select>


            <div class="form-group">
                <label for="code">Укажите вес</label>
                <input type="text" id="weight" name="weight" required>
            </div>

            <div class="form-group">
                <label for="code">Укажите количество повторений</label>
                <input type="text" id="count" name="count" required>
            </div>

            <div class="form-group">
                <input type="submit" value="Отправить">
            </div>

        </form>


    {{template "footer"}}
{{end}}
