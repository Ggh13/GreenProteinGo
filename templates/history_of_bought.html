
{{define "history_of_bought"}}

{{template "header" .}}

    <div class="row">
      <div class="col-12">
        <h1> История покупок </h1>
      </div>
    </div>


<div class="row">
    {{ range .Products }}

    <div class = "col-12">
      {{.Date}}
    </div>
    <div class="col-12 adaptive_margin_bottom standart_border_radius" style="height:200px; width:100%; background-color:green">

        <div class="row">
          <div class="col-2 ">
            <div class="row">

              <div class="col-12 img_center_on_main">
                <img class="standart_border_radius" style="width:200px; height:200px; " src="{{.Icon_product}}" alt="Image!!" >
              </div>

            </div>

          </div>

          <div class="col-10 ">
            <div class="row">
              <div class="col-10 center_text_in_div">
                {{.Name}}
              </div>
              <div class="col-2 ">
                {{.Price}}
              </div>
              <div class="col-5 ">
                {{.Brand}}
              </div>
              <div class="col-4 ">

              </div>

              <div class="col-3 center_text_in_div">
                {{.Quantity_in_cart}}
              </div>

            </div>
          </div>
        </div>
      </div>
    {{ end }}

</div>
{{template "footer"}}
{{end}}
